[package]
name = "crux"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "AI-assisted triage layer for security findings: dedup, false-positive cut, confidence + abstain gate, hash-chained audit, ranked queue."
readme = "README.md"
rust-version = "1.80"

[lib]
name = "crux"
path = "src/lib.rs"

[[bin]]
name = "crux"
path = "src/main.rs"

[features]
# `anthropic` pulls in the HTTPS client for the LLM triager. Library users that
# only need the offline MockTriager (or their own Triager) can disable it with
# `default-features = false` and get no network code at all.
default = ["anthropic"]
anthropic = ["dep:reqwest"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
regex = "1"
thiserror = "2"
# rustls (not OpenSSL) so the binary links statically with no system TLS library.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
