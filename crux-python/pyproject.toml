[project]
name = "crux"
version = "0.1.0"
description = "Crux: AI triage layer for security findings (dedup, false-positive cut, confidence + abstain, audit, rank)."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40.0"]

[project.scripts]
crux = "crux.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["crux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
